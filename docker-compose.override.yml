# Development overrides — bind-mount source for hot-reload
version: "3.9"

services:
  backend:
    volumes:
      - ./backend/app:/app/app
      - uploads_data:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

